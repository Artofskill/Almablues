<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Все мероприятия — Chelsea FC KZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #001028;
      --chelsea-blue: #034694;
      --chelsea-blue-dark: #002366;
      --gold: #D4A017;
      --gold-hover: #E8B923;
      --text-light: #e0e0e0;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Кнопка "Назад" */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
      padding: 10px 15px;
      background: rgba(212, 160, 23, 0.15);
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid rgba(212, 160, 23, 0.3);
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: rgba(212, 160, 23, 0.25);
      border-color: var(--gold);
      transform: translateX(-3px);
    }

    .back-btn::before {
      content: "←";
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .header-icon {
      font-size: 2.5rem;
      margin-bottom: 5px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      color: var(--gold);
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 0;
    }

    .header-subtitle {
      color: #aaa;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .events-list {
      margin-top: 20px;
    }

    .event-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      border-left: 4px solid var(--chelsea-blue);
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .event-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(5px);
      box-shadow: 0 4px 12px rgba(3, 70, 148, 0.3);
    }

    .event-item.closed {
      border-left-color: #f44336;
      opacity: 0.7;
    }

    .event-item.closed:hover {
      opacity: 0.85;
    }

    .event-item.full {
      border-left-color: #FFC107;
    }

    .event-name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      color: var(--white);
      margin-bottom: 5px;
    }

    .event-details {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .event-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: var(--chelsea-blue);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-right: 8px;
      margin-top: 8px;
      transition: all 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      background: var(--chelsea-blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-green {
      background: linear-gradient(135deg, #4CAF50, #388E3C);
    }

    .btn-green:hover {
      background: linear-gradient(135deg, #388E3C, #2E7D32);
    }

    .btn-red {
      background: linear-gradient(135deg, #f44336, #d32f2f);
    }

    .btn-red:hover {
      background: linear-gradient(135deg, #d32f2f, #c62828);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-hover));
      color: var(--bg-dark);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, var(--gold-hover), var(--gold));
    }

    .btn-disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-disabled:hover {
      background: #555;
      transform: none;
      box-shadow: none;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      border: 2px dashed rgba(255, 255, 255, 0.1);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .empty-state h3 {
      color: var(--text-light);
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gold);
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .loading::before {
      content: '⏳';
      font-size: 3rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 5px;
      gap: 5px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
      font-weight: 500;
      color: #aaa;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-light);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--chelsea-blue), var(--chelsea-blue-dark));
      color: var(--white);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(3, 70, 148, 0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      margin-left: 5px;
      vertical-align: middle;
    }

    .status-registered {
      background: rgba(33, 150, 243, 0.2);
      color: #2196F3;
    }

    .status-checked_in {
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
    }

    .status-cancelled {
      background: rgba(244, 67, 54, 0.2);
      color: #F44336;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #777;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Адаптивность */
    @media (max-width: 600px) {
      body {
        padding: 15px 10px;
      }

      .back-btn {
        padding: 10px 12px;
        font-size: 0.95rem;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 1.9rem;
      }

      .header-icon {
        font-size: 2.2rem;
      }

      .tabs {
        padding: 4px;
        gap: 4px;
      }

      .tab {
        padding: 10px 12px;
        font-size: 0.9rem;
      }

      .event-item {
        padding: 15px;
      }

      .event-name {
        font-size: 1.1rem;
      }

      .btn {
        padding: 8px 14px;
        font-size: 0.85rem;
        margin-right: 6px;
        margin-top: 6px;
      }
    }

    @media (max-width: 400px) {
      .back-btn {
        width: 100%;
        justify-content: center;
      }

      h1 {
        font-size: 1.7rem;
      }

      .tab {
        padding: 8px 10px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>
<div class="container">
  <a href="dashboard.html" class="back-btn">Назад</a>
  
  <header>
    <div class="header-content">
      <div class="header-icon">📅</div>
      <h1>Мероприятия</h1>
      <p class="header-subtitle">Расписание матчей и встреч фанатов</p>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('upcoming')">Предстоящие</div>
    <div class="tab" onclick="switchTab('past')">Прошедшие</div>
    <div class="tab" onclick="switchTab('all')">Все</div>
  </div>

  <div id="loading" class="loading">Загрузка мероприятий...</div>
  
  <div id="upcoming-tab" class="tab-content active">
    <div id="upcoming-events" class="events-list">
      <!-- Предстоящие мероприятия -->
    </div>
  </div>

  <div id="past-tab" class="tab-content">
    <div id="past-events" class="events-list">
      <!-- Прошедшие мероприятия -->
    </div>
  </div>

  <div id="all-tab" class="tab-content">
    <div id="all-events" class="events-list">
      <!-- Все мероприятия -->
    </div>
  </div>

  <footer>
    <p>Chelsea FC Supporters Club Kazakhstan • 2026 by @Artofskill</p>
  </footer>
</div>

<script>
  // === Telegram ===
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // === Supabase ===
  const supabaseUrl = 'https://zuapiixwzkleygaijulx.supabase.co';
  const supabaseKey = 'sb_publishable_Jsth-2GViNz5Ev3UWtrWTg_fbg4GAKx';

  const supabaseClient = supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

  const userId = localStorage.getItem('userId');

  if (!userId) {
    alert('Сессия истекла. Пожалуйста, вернитесь на главную страницу.');
    location.href = 'index.html';
  }

  function switchTab(tabName) {
    // Обновляем активные табы
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
    document.getElementById(`${tabName}-tab`).classList.add('active');
  }

  // Загружаем все мероприятия
  async function loadAllEvents() {
    try {
      const { data: events, error } = await supabaseClient
        .from('events')
        .select('*')
        .order('match_date', { ascending: false });

      const loadingEl = document.getElementById('loading');
      
      if (error) {
        loadingEl.innerHTML = '<p style="color: #ff6666;">Ошибка загрузки мероприятий</p>';
        return;
      }
      
      if (!events || events.length === 0) {
        loadingEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>Мероприятий нет</h3>
            <p>Пока не запланировано ни одного мероприятия</p>
          </div>
        `;
        return;
      }

      // Скрываем loading
      loadingEl.style.display = 'none';
      
      const now = new Date();
      const upcomingEvents = [];
      const pastEvents = [];
      
      for (const event of events) {
        const eventDate = new Date(event.match_date);
        
        // Получаем количество записанных участников (registered + checked_in)
        const { count: activeParticipants } = await supabaseClient
          .from('registrations')
          .select('*', { count: 'exact', head: true })
          .eq('event_id', event.id)
          .in('status', ['registered', 'checked_in']);
        
        event.activeParticipants = activeParticipants || 0;
        
        // Проверяем, записан ли текущий пользователь и какой у него статус
        const { data: userRegistration } = await supabaseClient
          .from('registrations')
          .select('status')
          .eq('user_id', userId)
          .eq('event_id', event.id)
          .in('status', ['registered', 'checked_in'])
          .maybeSingle();
        
        // Пользователь уже записан если статус registered или checked_in
        event.isRegistered = !!userRegistration;
        event.userStatus = userRegistration ? userRegistration.status : null;
        
        if (eventDate >= now) {
          upcomingEvents.push(event);
        } else {
          pastEvents.push(event);
        }
      }
      
      // Сортируем предстоящие по дате (от ближайших)
      upcomingEvents.sort((a, b) => new Date(a.match_date) - new Date(b.match_date));
      
      // Сортируем прошедшие по дате (от недавних)
      pastEvents.sort((a, b) => new Date(b.match_date) - new Date(a.match_date));
      
      // Отображаем мероприятия
      renderEvents('upcoming-events', upcomingEvents, false);
      renderEvents('past-events', pastEvents, true);
      renderEvents('all-events', events, false);
      
    } catch (err) {
      console.error('Error loading events:', err);
      document.getElementById('loading').innerHTML = '<p style="color: #ff6666;">Неожиданная ошибка при загрузке</p>';
    }
  }

  function renderEvents(containerId, events, isPast) {
    const container = document.getElementById(containerId);
    
    if (!events || events.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <h3>Мероприятий нет</h3>
          <p>${isPast ? 'Нет прошедших мероприятий' : 'Нет предстоящих мероприятий'}</p>
        </div>
      `;
      return;
    }
    
    let html = '';
    
    events.forEach(event => {
      const eventDate = new Date(event.match_date);
      const formattedDate = eventDate.toLocaleDateString('ru-RU', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      const isFull = event.max_participants && event.activeParticipants >= event.max_participants;
      const isClosed = !event.is_open || isPast;
      const itemClass = isClosed ? 'event-item closed' : 
                       isFull ? 'event-item full' : 'event-item';
      
      let buttonHtml = '';
      
      if (!isPast) {
        // Проверяем, записан ли пользователь (статус registered или checked_in)
        if (event.isRegistered) {
          // Определяем текст статуса
          let statusText = 'Записан';
          let statusClass = 'status-registered';
          
          if (event.userStatus === 'checked_in') {
            statusText = 'Отметилcя';
            statusClass = 'status-checked_in';
          }
          
          buttonHtml = `
            <button class="btn btn-disabled" disabled>
              ✓ ${statusText} <span class="status-badge ${statusClass}">${statusText}</span>
            </button>
            <a href="event-participants.html?event_id=${event.id}" class="btn btn-gold">Участники</a>
          `;
        } else if (isClosed) {
          buttonHtml = `<button class="btn btn-disabled" disabled>Запись закрыта</button>`;
        } else if (isFull) {
          buttonHtml = `<button class="btn btn-disabled" disabled>Мест нет</button>`;
        } else {
          buttonHtml = `
            <button class="btn btn-green" onclick="registerForEvent('${event.id}', '${event.match_name}')">
              Записаться
            </button>
            <a href="event-participants.html?event_id=${event.id}" class="btn">Участники</a>
          `;
        }
      } else {
        buttonHtml = `
          <a href="event-participants.html?event_id=${event.id}" class="btn">Участники</a>
        `;
      }
      
      html += `
        <div class="${itemClass}">
          <div class="event-name">${event.match_name}</div>
          <div class="event-details">
            📅 ${formattedDate}<br>
            📍 ${event.bar_address}
            ${event.description ? `<br>📝 ${event.description}` : ''}
          </div>
          <div class="event-meta">
            <span>👥 ${event.activeParticipants}${event.max_participants ? `/${event.max_participants}` : ''} участников</span>
            <span>${event.is_open ? '✅ Открыта запись' : '❌ Закрыта запись'}</span>
          </div>
          <div>
            ${buttonHtml}
          </div>
        </div>
      `;
    });
    
    container.innerHTML = html;
  }

  async function registerForEvent(eventId, eventName) {
    if (!confirm(`Записаться на мероприятие "${eventName}"?`)) {
      return;
    }
    
    try {
      // Проверяем, существует ли уже активная запись (registered или checked_in)
      const { data: existing } = await supabaseClient
        .from('registrations')
        .select('id, status')
        .eq('user_id', userId)
        .eq('event_id', eventId)
        .in('status', ['registered', 'checked_in'])
        .maybeSingle();
      
      if (existing) {
        // Если уже есть активная запись, не позволяем записаться снова
        alert('ℹ️ Вы уже записаны на это мероприятие!');
        // Перезагружаем мероприятия чтобы обновить статус
        loadAllEvents();
        return;
      }
      
      // Проверяем, есть ли отмененная запись
      const { data: cancelledRegistration } = await supabaseClient
        .from('registrations')
        .select('id')
        .eq('user_id', userId)
        .eq('event_id', eventId)
        .eq('status', 'cancelled')
        .maybeSingle();
      
      if (cancelledRegistration) {
        // Обновляем существующую отмененную запись
        const { error } = await supabaseClient
          .from('registrations')
          .update({ 
            status: 'registered',
            updated_at: new Date().toISOString()
          })
          .eq('id', cancelledRegistration.id);
        
        if (error) throw error;
        alert('✅ Вы снова записаны на мероприятие!');
      } else {
        // Создаем новую запись
        const { error } = await supabaseClient
          .from('registrations')
          .insert({
            user_id: userId,
            event_id: eventId,
            status: 'registered'
          });
        
        if (error) throw error;
        alert('✅ Вы успешно записались на мероприятие!');
      }
      
      // Перезагружаем мероприятия
      loadAllEvents();
      
    } catch (error) {
      console.error('Error registering for event:', error);
      alert('❌ Ошибка при записи: ' + error.message);
    }
  }

  // Инициализация
  loadAllEvents();
</script>
</body>
</html>
