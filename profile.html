<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Профиль — AlmaBlues</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #001028;
      --chelsea-blue: #034694;
      --chelsea-blue-dark: #002366;
      --gold: #D4A017;
      --gold-hover: #E8B923;
      --text-light: #e0e0e0;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      color: var(--gold);
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    #status {
      text-align: center;
      margin: 1rem 0;
      color: var(--gold);
      font-size: 0.95rem;
    }

    /* Секция фото профиля */
    .profile-photo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .profile-photo-container {
      position: relative;
      margin-bottom: 15px;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--gold);
      box-shadow: 0 4px 20px rgba(212, 160, 23, 0.3);
      background: rgba(3, 70, 148, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--gold);
    }

    .photo-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--gold);
      background: rgba(3, 70, 148, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--gold);
      box-shadow: 0 4px 20px rgba(212, 160, 23, 0.3);
    }

    .photo-upload-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.2rem;
    }

    .photo-upload-btn:hover {
      background: var(--gold-hover);
      transform: scale(1.1);
    }

    #photo-input {
      display: none;
    }

    .upload-instructions {
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 8px;
    }

    /* Форма */
    .profile-form {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 1.5rem;
    }

    .field {
      margin-bottom: 1.5rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--white);
      font-size: 0.95rem;
    }

    .field label .required {
      color: #ff6666;
      margin-left: 3px;
    }

    input, .readonly {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 16, 40, 0.5);
      color: var(--white);
      font-size: 1rem;
      font-family: 'Roboto', sans-serif;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(0, 16, 40, 0.7);
      box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.1);
    }

    input::placeholder {
      color: #666;
    }

    .readonly {
      background: rgba(3, 70, 148, 0.15);
      border-color: rgba(3, 70, 148, 0.3);
      color: #aaa;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Статистика */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--gold);
      font-family: 'Oswald', sans-serif;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Кнопки */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 1.5rem;
    }

    button, .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-family: 'Roboto', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-hover));
      color: var(--bg-dark);
      box-shadow: 0 4px 15px rgba(212, 160, 23, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 160, 23, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(3, 70, 148, 0.2);
      color: var(--white);
      border: 2px solid var(--chelsea-blue);
    }

    .btn-secondary:hover {
      background: var(--chelsea-blue);
      transform: translateY(-2px);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    /* Индикатор загрузки */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 16, 40, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(212, 160, 23, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--gold);
      font-size: 1.1rem;
      font-weight: 500;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #777;
      font-size: 0.85rem;
    }

    /* Уведомления */
    .notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, var(--chelsea-blue), var(--chelsea-blue-dark));
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 1001;
      font-weight: 500;
      transition: transform 0.3s ease-out;
    }

    .notification.show {
      transform: translateX(-50%) translateY(0);
    }

    .notification.success {
      background: linear-gradient(135deg, #4CAF50, #388E3C);
    }

    .notification.error {
      background: linear-gradient(135deg, #f44336, #d32f2f);
    }

    @media (max-width: 480px) {
      body { padding: 15px; }
      h1 { font-size: 1.8rem; }
      .profile-photo, .photo-placeholder { width: 100px; height: 100px; font-size: 2.5rem; }
      .stat-value { font-size: 1.5rem; }
    }
  </style>
</head>

<body>
<div class="container">
  <header>
    <h1>Профиль</h1>
  </header>

  <div id="status">Загрузка профиля...</div>

  <!-- Секция фото профиля -->
  <div class="profile-photo-section" style="display: none;" id="photo-section">
    <div class="profile-photo-container">
      <div class="photo-placeholder" id="photo-display">
        👤
      </div>
      <label for="photo-input" class="photo-upload-btn">
        📷
      </label>
      <input type="file" id="photo-input" accept="image/*">
    </div>
    <div class="upload-instructions">
      Нажмите на 📷 чтобы загрузить фото
    </div>
  </div>

  <!-- Статистика -->
  <div class="stats-grid" style="display: none;" id="stats-section">
    <div class="stat-card">
      <div class="stat-value" id="points-stat">0</div>
      <div class="stat-label">Очков</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="checkins-stat">0</div>
      <div class="stat-label">Посещений</div>
    </div>
  </div>

  <!-- Форма профиля -->
  <form id="profile-form" class="profile-form" style="display: none;">
    <div class="field">
      <label>Telegram username</label>
      <div class="readonly" id="username">Загрузка...</div>
    </div>

    <div class="field">
      <label>ФИО <span class="required">*</span></label>
      <input type="text" id="full_name" placeholder="Введите ваше полное имя" required>
    </div>

    <div class="field">
      <label>Номер телефона</label>
      <input type="tel" id="phone" placeholder="+7 (XXX) XXX-XX-XX">
    </div>

    <div class="field">
      <label>Статус членства</label>
      <div class="readonly" id="membership_status">New</div>
    </div>

    <button type="submit" class="btn-primary">💾 Сохранить изменения</button>
  </form>

  <!-- Кнопки навигации -->
  <div class="button-group" style="display: none;" id="nav-buttons">
    <button class="btn-secondary" onclick="location.href='dashboard.html'">
      🏠 Перейти в Dashboard
    </button>
  </div>

  <footer>
    <p>Chelsea FC Supporters Club Kazakhstan • 2026</p>
  </footer>
</div>

<!-- Индикатор загрузки -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Загрузка фото...</div>
</div>

<script>
  // === Cloudinary Configuration ===
  const CLOUDINARY_CLOUD_NAME = 'YOUR_CLOUD_NAME'; // ← ЗАМЕНИТЬ НА ТВОЕ ЗНАЧЕНИЕ
  const CLOUDINARY_UPLOAD_PRESET = 'YOUR_UPLOAD_PRESET'; // ← ЗАМЕНИТЬ НА ТВОЕ ЗНАЧЕНИЕ

  // === Telegram ===
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  if (!tg.initDataUnsafe?.user) {
    showNotification('Откройте страницу через Telegram', 'error');
    throw new Error('Not Telegram WebApp');
  }

  // === Supabase ===
  const supabaseUrl = 'https://zuapiixwzkleygaijulx.supabase.co';
  const supabaseKey = 'sb_publishable_Jsth-2GViNz5Ev3UWtrWTg_fbg4GAKx';
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  const userId = localStorage.getItem('userId');

  if (!userId) {
    showNotification('Сессия истекла. Вернитесь на главную страницу.', 'error');
    setTimeout(() => location.href = 'index.html', 2000);
    throw new Error('No userId');
  }

  // === Загрузка профиля ===
  async function loadProfile() {
    try {
      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('id', userId)
        .single();

      if (error || !data) {
        showNotification('Профиль не найден. Войдите заново.', 'error');
        return;
      }

      // Заполняем поля
      document.getElementById('username').textContent = data.username || 'не указан';
      document.getElementById('full_name').value = data.full_name || '';
      document.getElementById('phone').value = data.phone || '';
      document.getElementById('membership_status').textContent = getMembershipStatusText(data.membership_status);
      
      // Статистика
      document.getElementById('points-stat').textContent = data.points ?? 0;
      document.getElementById('checkins-stat').textContent = data.total_checkins ?? 0;

      // Фото профиля
      if (data.profile_photo_url) {
        const photoDisplay = document.getElementById('photo-display');
        photoDisplay.innerHTML = `<img src="${data.profile_photo_url}" alt="Profile" class="profile-photo">`;
      }

      // Показываем интерфейс
      document.getElementById('status').style.display = 'none';
      document.getElementById('photo-section').style.display = 'flex';
      document.getElementById('stats-section').style.display = 'grid';
      document.getElementById('profile-form').style.display = 'block';
      document.getElementById('nav-buttons').style.display = 'flex';

    } catch (err) {
      console.error('Error loading profile:', err);
      showNotification('Ошибка загрузки профиля', 'error');
    }
  }

  // Перевод статуса членства
  function getMembershipStatusText(status) {
    const statusMap = {
      'New': 'Новый',
      'pending': 'На рассмотрении',
      'approved': 'Одобрен',
      'rejected': 'Отклонён'
    };
    return statusMap[status] || status;
  }

  // === Загрузка фото в Cloudinary ===
  document.getElementById('photo-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Проверка размера (макс 5MB)
    if (file.size > 5 * 1024 * 1024) {
      showNotification('Файл слишком большой. Максимум 5MB', 'error');
      return;
    }

    // Проверка типа файла
    if (!file.type.startsWith('image/')) {
      showNotification('Можно загружать только изображения', 'error');
      return;
    }

    try {
      // Показываем индикатор загрузки
      document.getElementById('loading-overlay').classList.add('active');

      // Создаем FormData для загрузки
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', 'almablues/profiles'); // Папка в Cloudinary

      // Загружаем в Cloudinary
      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        {
          method: 'POST',
          body: formData
        }
      );

      if (!response.ok) {
        throw new Error('Ошибка загрузки в Cloudinary');
      }

      const data = await response.json();
      const photoUrl = data.secure_url;

      // Сохраняем URL в базу данных
      const { error: updateError } = await supabaseClient
        .from('users')
        .update({ profile_photo_url: photoUrl })
        .eq('id', userId);

      if (updateError) throw updateError;

      // Обновляем отображение
      const photoDisplay = document.getElementById('photo-display');
      photoDisplay.innerHTML = `<img src="${photoUrl}" alt="Profile" class="profile-photo">`;

      showNotification('✅ Фото успешно загружено!', 'success');

    } catch (error) {
      console.error('Error uploading photo:', error);
      showNotification('❌ Ошибка загрузки фото', 'error');
    } finally {
      // Скрываем индикатор
      document.getElementById('loading-overlay').classList.remove('active');
      // Сбрасываем input
      e.target.value = '';
    }
  });

  // === Сохранение профиля ===
  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('full_name').value.trim();
    const phone = document.getElementById('phone').value.trim() || null;

    if (!fullName) {
      showNotification('Укажите ФИО', 'error');
      return;
    }

    try {
      const { error } = await supabaseClient
        .from('users')
        .update({ 
          full_name: fullName, 
          phone: phone,
          updated_at: new Date().toISOString()
        })
        .eq('id', userId);

      if (error) throw error;

      // Обновляем localStorage
      localStorage.setItem('userFullName', fullName);

      showNotification('✅ Профиль успешно обновлён!', 'success');
      
      // Переходим в dashboard через 1.5 секунды
      setTimeout(() => location.href = 'dashboard.html', 1500);

    } catch (error) {
      console.error('Error saving profile:', error);
      showNotification('❌ Ошибка сохранения: ' + error.message, 'error');
    }
  });

  // === Уведомления ===
  function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    document.body.appendChild(notification);

    setTimeout(() => notification.classList.add('show'), 100);

    setTimeout(() => {
      notification.classList.remove('show');
      setTimeout(() => document.body.removeChild(notification), 300);
    }, 3000);
  }

  // Форматирование телефона
  document.getElementById('phone').addEventListener('input', function (e) {
    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
    if (!x[2] && x[1] !== '7') x[1] = '7';
    if (x[1] === '8') x[1] = '7';
    e.target.value = !x[2] ? '+' + x[1] : '+' + x[1] + ' (' + x[2] + (x[3] ? ') ' + x[3] : '') + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
  });

  // Инициализация
  loadProfile();
</script>

</body>
</html>
